name: Build LootHelper Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Генерируем wrapper или собираем напрямую через gradle:
      - name: Build with Gradle
        run: gradle build

      - name: Upload Mod Artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: LootHelper-Build
          path: build/libs/*.jar
